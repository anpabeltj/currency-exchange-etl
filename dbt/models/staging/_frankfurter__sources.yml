version: 2

sources:
  - name: frankfurter
    description: Raw exchange rates appended by the Airflow extract_load_raw task.
    schema: raw
    config:
      loaded_at_field: "rate_date::timestamp"
      freshness:
        # ECB does not publish on weekends or holidays, so allow a long weekend
        warn_after: {count: 4, period: day}
        error_after: {count: 7, period: day}
    tables:
      - name: rates
        identifier: frankfurter_rates
        description: Append only. The same date and pair can appear many times because of the lookback window.
        columns:
          - name: raw_id
            data_tests:
              - unique
              - not_null
